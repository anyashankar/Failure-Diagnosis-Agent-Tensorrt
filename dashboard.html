<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Build Failure Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0E14;
    --panel: #12161F;
    --panel-alt: #171C27;
    --border: #242938;
    --text: #E7E5E0;
    --text-dim: #8A93A6;
    --amber: #D9A441;
    --green: #6FCF97;
    --red: #E2604A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-shrink: 0;
  }
  header h1 {
    font-size: 17px;
    font-weight: 600;
    margin: 0;
  }
  header .sub {
    color: var(--text-dim);
    font-size: 13px;
  }
  .live-dot {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-dim);
    font-size: 12px;
    font-family: 'IBM Plex Mono', monospace;
  }
  .live-dot span.dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--amber);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
  .layout {
    display: flex;
    flex: 1;
    min-height: 0;
  }
  .rail {
    width: 320px;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    min-height: 0;
  }
  .rail-section {
    padding: 18px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .rail-section.queue-section {
    flex-shrink: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .rail-section.queue-section .queue-scroll {
    overflow-y: auto;
    margin: 0 -18px -18px -18px;
  }
  .rail-section h2 {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-dim);
    margin: 0 0 12px 0;
    letter-spacing: 0.02em;
  }
  label {
    display: block;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 4px;
    margin-top: 10px;
  }
  label:first-child { margin-top: 0; }
  select, input[type=text] {
    width: 100%;
    background: var(--panel-alt);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 3px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
  }
  select:focus, input:focus {
    outline: 1px solid var(--amber);
    outline-offset: -1px;
  }
  button.start {
    width: 100%;
    margin-top: 14px;
    background: var(--amber);
    color: #1A1305;
    border: none;
    padding: 10px;
    border-radius: 3px;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }
  button.start:hover { filter: brightness(1.08); }
  button.start:disabled { opacity: 0.5; cursor: default; }

  .queue-item {
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .queue-item:hover { background: var(--panel-alt); }
  .queue-item.selected { background: var(--panel-alt); border-left: 2px solid var(--amber); }
  .queue-item .name {
    font-weight: 500;
    font-size: 13px;
  }
  .queue-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .stop-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 2px;
    cursor: pointer;
    margin-left: 6px;
  }
  .stop-btn:hover { border-color: var(--red); color: var(--red); }
  .pill {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    padding: 2px 7px;
    border-radius: 2px;
    text-transform: lowercase;
    letter-spacing: 0.02em;
  }
  .pill.queued, .pill.running { background: rgba(217,164,65,0.15); color: var(--amber); }
  .pill.completed { background: rgba(111,207,151,0.15); color: var(--green); }
  .pill.failed, .pill.error { background: rgba(226,96,74,0.15); color: var(--red); }
  .pill.stopped { background: rgba(138,147,166,0.15); color: var(--text-dim); }
  .empty-queue {
    padding: 24px 18px;
    color: var(--text-dim);
    font-size: 12.5px;
    line-height: 1.5;
  }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 28px 36px;
  }
  .no-selection {
    color: var(--text-dim);
    font-size: 13.5px;
    max-width: 420px;
    line-height: 1.6;
  }
  .job-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 22px;
  }
  .job-header h2 {
    margin: 0;
    font-size: 19px;
    font-weight: 600;
  }
  .metrics {
    display: flex;
    gap: 28px;
    margin-bottom: 32px;
    padding: 16px 20px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
  }
  .metric .label {
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .metric .value {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 17px;
    font-weight: 500;
  }
  .metric .value.pass { color: var(--green); }
  .metric .value.fail { color: var(--red); }

  .trace { position: relative; padding-left: 26px; }
  .trace::before {
    content: '';
    position: absolute;
    left: 5px;
    top: 6px;
    bottom: 6px;
    width: 1px;
    background: var(--border);
  }
  .trace-node {
    position: relative;
    margin-bottom: 22px;
  }
  .trace-node::before {
    content: '';
    position: absolute;
    left: -26px;
    top: 3px;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: var(--bg);
  }
  .trace-node.running::before { border-color: var(--amber); background: var(--amber); }
  .trace-node.pass::before { border-color: var(--green); background: var(--green); }
  .trace-node.fail::before { border-color: var(--red); background: var(--red); }
  .trace-node .attempt-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .trace-node .diagnosis {
    font-size: 13.5px;
    margin-bottom: 4px;
  }
  .trace-node .patch {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 8px 10px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  footer {
    border-top: 1px solid var(--border);
    padding: 10px 24px;
    display: flex;
    gap: 10px;
    align-items: center;
    overflow-x: auto;
    flex-shrink: 0;
    min-height: 40px;
  }
  footer .footer-label {
    font-size: 11px;
    color: var(--text-dim);
    flex-shrink: 0;
    font-family: 'IBM Plex Mono', monospace;
  }
  .notif-chip {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 4px 9px;
    border-radius: 3px;
    border: 1px solid var(--border);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .notif-chip.success { color: var(--green); border-color: rgba(111,207,151,0.3); }
  .notif-chip.failed { color: var(--red); border-color: rgba(226,96,74,0.3); }
</style>
</head>
<body>

<header>
  <h1>Build failure agent</h1>
  <span class="sub">TensorRT diagnose &middot; patch &middot; validate</span>
  <div class="live-dot"><span class="dot"></span>watching</div>
</header>

<div class="layout">
  <div class="rail">
    <div class="rail-section">
      <h2>Start a run</h2>
      <label>Model</label>
      <select id="modelPath">
        <option value="/home/anyashan/bert.onnx">BERT (dynamic shapes)</option>
        <option value="/home/anyashan/yolov8n_prenms.onnx">YOLOv8n (workspace)</option>
      </select>
      <label>Run name</label>
      <input type="text" id="modelName" value="BERT" />
      <label>Scenario</label>
      <select id="scenario">
        <option value="">Clean run</option>
        <option value="naive_fp16_precision">Force naive FP16 (regression demo)</option>
      </select>
      <button class="start" id="startBtn" onclick="startJob()">Start run</button>
    </div>
    <div class="rail-section queue-section" style="border-bottom:none;">
      <div class="queue-row" style="margin-bottom:12px;">
        <h2 style="margin:0;">Queue</h2>
        <button class="stop-btn" onclick="clearQueue()">clear all</button>
      </div>
      <div class="queue-scroll">
        <div id="queueList"></div>
      </div>
    </div>
  </div>

  <main id="main">
    <div class="no-selection">Select a run from the queue, or start a new one, to see its diagnosis trace and validation results here.</div>
  </main>
</div>

<footer>
  <span class="footer-label">recent</span>
  <div id="notifRow" style="display:flex; gap:8px;"></div>
</footer>

<script>
const API = window.location.origin;
let selectedJobId = null;
let jobsCache = {};

async function startJob() {
  const btn = document.getElementById('startBtn');
  btn.disabled = true;
  const onnx_path = document.getElementById('modelPath').value;
  const model_name = document.getElementById('modelName').value || 'model';
  const scenario = document.getElementById('scenario').value;

  const body = { onnx_path, model_name };
  if (scenario) body.force_first_patch = scenario;

  try {
    const res = await fetch(`${API}/jobs`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    });
    const data = await res.json();
    selectedJobId = data.job_id;
    await refresh();
  } finally {
    btn.disabled = false;
  }
}

async function stopJob(id) {
  await fetch(`${API}/jobs/${id}/stop`, { method: 'POST' });
  await refresh();
}

async function clearQueue() {
  selectedJobId = null;
  await fetch(`${API}/jobs`, { method: 'DELETE' });
  await refresh();
}

function pill(status) {
  return `<span class="pill ${status}">${status}</span>`;
}

function renderQueue(jobs) {
  const list = document.getElementById('queueList');
  const ids = Object.keys(jobs);
  if (ids.length === 0) {
    list.innerHTML = `<div class="empty-queue">No runs yet. Start one above.</div>`;
    return;
  }
  list.innerHTML = ids.map(id => {
    const j = jobs[id];
    const sel = id === selectedJobId ? 'selected' : '';
    const canStop = j.status === 'running' || j.status === 'queued';
    return `<div class="queue-item ${sel}" onclick="selectJob('${id}')">
      <div class="queue-row">
        <span class="name">${j.model_name}</span>
        <span>
          ${pill(j.status)}
          ${canStop ? `<button class="stop-btn" onclick="event.stopPropagation(); stopJob('${id}')">stop</button>` : ''}
        </span>
      </div>
    </div>`;
  }).reverse().join('');
}

function selectJob(id) {
  selectedJobId = id;
  renderDetail();
  renderQueue(jobsCache);
}

function renderDetail() {
  const main = document.getElementById('main');
  if (!selectedJobId || !jobsCache[selectedJobId]) {
    main.innerHTML = `<div class="no-selection">Select a run from the queue, or start a new one, to see its diagnosis trace and validation results here.</div>`;
    return;
  }
  const job = jobsCache[selectedJobId];

  let metricsHtml = '';
  if (job.result && job.result.benchmark) {
    const b = job.result.benchmark;
    const a = job.result.accuracy || {};
    const passClass = a.passed ? 'pass' : 'fail';
    metricsHtml = `
      <div class="metrics">
        <div class="metric"><div class="label">avg latency</div><div class="value">${b.avg_latency_ms ? b.avg_latency_ms.toFixed(3) + 'ms' : '—'}</div></div>
        <div class="metric"><div class="label">worst similarity</div><div class="value">${a.worst_cosine_similarity ? a.worst_cosine_similarity.toFixed(6) : '—'}</div></div>
        <div class="metric"><div class="label">validation</div><div class="value ${passClass}">${a.passed === undefined ? '—' : (a.passed ? 'passed' : 'failed')}</div></div>
      </div>`;
  }

  let traceHtml = `<div class="no-selection" style="margin-top:12px;">Waiting for the first build attempt…</div>`;
  if (job.attempts && job.attempts.length > 0) {
    traceHtml = `<div class="trace">` + job.attempts.map(a => {
      const cls = a.outcome === 'succeeded' ? 'pass' : (a.outcome === 'running' ? 'running' : 'fail');
      return `<div class="trace-node ${cls}">
        <div class="attempt-label">attempt ${a.attempt}</div>
        <div class="diagnosis">${a.diagnosis || (a.outcome === 'succeeded' ? 'Build succeeded' : '')}</div>
        ${a.patch ? `<div class="patch">${a.patch}</div>` : ''}
      </div>`;
    }).join('') + `</div>`;
  }

  main.innerHTML = `
    <div class="job-header">
      <h2>${job.model_name}</h2>
      ${pill(job.status)}
    </div>
    ${metricsHtml}
    ${traceHtml}
  `;
}

function renderNotifications(notifs) {
  const row = document.getElementById('notifRow');
  if (!notifs || notifs.length === 0) {
    row.innerHTML = `<span style="color:var(--text-dim); font-size:12px;">none yet</span>`;
    return;
  }
  row.innerHTML = notifs.slice(-6).reverse().map(n => {
    const cls = n.includes('SUCCESS') ? 'success' : 'failed';
    return `<div class="notif-chip ${cls}">${n}</div>`;
  }).join('');
}

async function refresh() {
  try {
    const res = await fetch(`${API}/jobs`);
    const jobs = await res.json();
    jobsCache = jobs;
    renderQueue(jobs);
    if (selectedJobId) {
      const detailRes = await fetch(`${API}/jobs/${selectedJobId}`);
      jobsCache[selectedJobId] = await detailRes.json();
    }
    renderDetail();

    const notifRes = await fetch(`${API}/notifications`);
    const notifData = await notifRes.json();
    renderNotifications(notifData.recent || []);
  } catch (e) {
    console.error('refresh failed', e);
  }
}

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
